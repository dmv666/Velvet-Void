# fly launch --no-deploy --copy-config && fly secrets set DATABASE_URL=... MIGRATION_DATABASE_URL=... SEED_ENCRYPTION_KEY=...
app = "velvet-void-api"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile.server"

[deploy]
  # Migraciones con el rol dueño ANTES de que arranque la nueva versión.
  release_command = "node dist/migrate.js"

[env]
  NODE_ENV = "production"
  # Solo el proxy de Fly llega a la máquina: es seguro confiar en X-Forwarded-For.
  TRUST_PROXY = "true"
  CLIENT_ORIGIN = "https://play.example.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # UNA máquina: el rate limit está en memoria (ver SECURITY.md §5).
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
